name: Generate Météo Live Apple icon
on:
  push:
    branches: [fix/meteo-live-apple-icon]
    paths:
      - .github/workflows/generate-meteo-apple-icon.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.7.1
      - name: Render existing Météo Live favicon to 180x180 PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="app_meteo_js/favicon.svg",write_to="app_meteo_js/apple-touch-icon.png",output_width=180,output_height=180)
          PY
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_meteo_js/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(meteo): add existing weather favicon as Apple icon"
            git push
          fi
