name: Generate JSL Code iOS icon
on:
  push:
    branches:
      - fix/ios-home-icon-jsl
    paths:
      - .github/workflows/generate-ios-icon.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.7.1
      - name: Convert favicon to 180 pixel PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="images/jsl-favicon.svg",write_to="apple-touch-icon.png",output_width=180,output_height=180)
          PY
      - name: Commit icon asset to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: add JSL Code Apple touch icon"
            git push
          fi
